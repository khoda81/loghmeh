name: Release
# Push a tag such as v0.7.0 that matches extension/manifest.json. The GitHub release
# always runs; each store upload runs only when its repository variable is "true".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      store:
        description: 'Store to retry. Select the existing version tag as the workflow ref.'
        type: choice
        options: [both, firefox, chrome]
        default: both
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - name: Require the tag to match the manifest version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version extension/manifest.json)"
      - run: bun run package
      - run: bunx --bun web-ext@10.7.0 lint --source-dir dist/firefox --warnings-as-errors
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The GitHub release already exists; continuing with the selected store."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Loghmeh $version" --generate-notes \
            --notes "Install from the browser stores when listed. These ZIPs are for review and developer loading: Chrome → chrome://extensions → Developer mode → Load unpacked (unzip first); Firefox → about:debugging → Load Temporary Add-on (unsigned, removed on restart). The source ZIP rebuilds them with bun install --frozen-lockfile && bun run package." \
            "dist/loghmeh-$version-firefox.zip" "dist/loghmeh-$version-chrome.zip" "dist/loghmeh-$version-source.zip"

  firefox-add-ons:
    needs: github-release
    if: vars.PUBLISH_FIREFOX == 'true' && (github.event_name == 'push' || inputs.store == 'both' || inputs.store == 'firefox')
    runs-on: ubuntu-latest
    environment: firefox-add-ons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run package
      # Submits a listed version for Mozilla review without waiting for approval.
      # The build is bundled, so AMO also receives the source and build instructions.
      - run: bunx --bun web-ext@10.7.0 sign --source-dir dist/firefox --artifacts-dir dist/amo --channel listed --approval-timeout 0 --amo-metadata store/amo-metadata.json --upload-source-code "dist/loghmeh-${GITHUB_REF_NAME#v}-source.zip"
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

  chrome-web-store:
    needs: github-release
    if: vars.PUBLISH_CHROME == 'true' && (github.event_name == 'push' || inputs.store == 'both' || inputs.store == 'chrome')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run package
      # Uploads the ZIP and submits it for review; Google publishes after approval.
      - run: bunx --bun chrome-webstore-upload-cli@4.0.2 --source "dist/loghmeh-${GITHUB_REF_NAME#v}-chrome.zip"
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
